# =============================================================================
# GenAiOrionPanel — tek deployment.
#
#   docker compose up --build
#     → postgres + backend-api + backend-worker + frontend
#
# LDAP: Allianz Active Directory. Compose içinde OpenLDAP / ldap-ui yok.
# LDAP_* (host, bind DN, parola, CA path) yalnız ``deployment/.env``
# üzerinden ``env_file`` ile container'a girer. ``environment:`` bloğuna
# yazılmaz — compose ``$`` interpolasyonu bind parolasını bozar.
#
# Port haritası (host ↔ container):
#   frontend (next start)        8058 ↔ 3000
#   backend-api (uvicorn)        8056 ↔ 8000
#   backend-worker (probe)       8057 ↔ 8057
#   postgres                     internal-only (no host publish);
#                                ``docker compose exec postgres psql ...``
#
# Host portları: 8056-8058 inventory taramasıyla boştur.
# =============================================================================

name: genai-orion-panel

services:

  # ---------------------------------------------------------------------------
  # CORE
  # ---------------------------------------------------------------------------

  # -- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: genai-orion-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel
      # Password: PANEL_DB_PASSWORD (deployment/.env). Do not interpolate
      # DB_USERNAME/DB_NAME — host ``backend/.env`` (admin/genai_orion) leaks
      # into compose and recreates Postgres as the local-smoke role.
      POSTGRES_PASSWORD: ${PANEL_DB_PASSWORD:-OrionPanel123!}
      POSTGRES_DB: panel
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - panel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # NOT: Postgres container içinde tamamen internal'dır. Yayın publish
    # YOK — backend DNS üzerinden ``postgres:5432``'e bağlanır. Operatör
    # psql erişmek istediğinde ``docker compose exec postgres psql -U
    # $DB_USERNAME -d $DB_NAME`` ile çalışır.

  # -- Backend API -----------------------------------------------------------
  backend-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      network: host
    container_name: genai-orion-panel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # LDAP_* yalnız buradan (deployment/.env). environment: bloğuna basma.
      - path: ./.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      PROCESS_ROLE: api
      PORT: "8000"
      API_HOST: 0.0.0.0
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      DB_MODE: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: panel
      DB_PASSWORD: ${PANEL_DB_PASSWORD:-OrionPanel123!}
      DB_NAME: panel
      CONN_POOL_SIZE: ${CONN_POOL_SIZE:-5}
      GENAI_ORION_PANEL_WEBHOOK_SECRET: ${GENAI_ORION_PANEL_WEBHOOK_SECRET:-change-me}
      GENAI_ORION_PANEL_CORS_ORIGINS: ${GENAI_ORION_PANEL_CORS_ORIGINS:-http://localhost:8058,http://localhost:3000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-placeholder}
      JWT_SECRET: ${JWT_SECRET:-change-me-32-bytes-of-base64-or-hex}
      ACTION_SIGNING_SECRET: ${ACTION_SIGNING_SECRET:-change-me-please-32-bytes-or-more0123456789}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-b3Jpb24tbG9jYWwtZGV2LWFlcy0zMmJ5dGUta2V5ISE=}
      KEY_ENCRYPTION_KEY_VERSION: ${KEY_ENCRYPTION_KEY_VERSION:-1}
      PUBLIC_ACTION_BASE_URL: ${PUBLIC_ACTION_BASE_URL:-http://localhost:8058/approvals}
      APPROVER_EMAILS: ${APPROVER_EMAILS:-approver@example.com}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin@local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@local}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      GENAI_ORION_PANEL_WEBHOOK_AUTH_MODE: ${GENAI_ORION_PANEL_WEBHOOK_AUTH_MODE:-hmac}
    volumes:
      - ./certs:/etc/ssl/corp:ro
    command: ["sh", "-c", "python main.py migrate && python main.py api"]
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # ---- 8056 host : 8000 container ----
    ports:
      - "8056:8000"

  # -- Backend outbox worker -------------------------------------------------
  backend-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      network: host
    container_name: genai-orion-panel-worker
    restart: unless-stopped
    # NOT: backend-api'ye değil postgres'e bağımlı — worker outbox DB'si
    # paylaşımlı; API ayakta olmasa da fetch yapar. API-only deploy
    # senaryosunda worker'ı `--scale=0` ile durdurabilirsiniz.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      PROCESS_ROLE: worker
      DB_MODE: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: panel
      DB_PASSWORD: ${PANEL_DB_PASSWORD:-OrionPanel123!}
      DB_NAME: panel
      WORKER_INTERNAL_SECONDS: ${PANEL_WORKER_INTERNAL_SECONDS:-10}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-8}
      LITELLM_RETRY: ${LITELLM_RETRY:-10}
      LITELLM_HOLD_MINUTES: ${LITELLM_HOLD_MINUTES:-5}
      MAIL_RETRY_MAX: ${MAIL_RETRY_MAX:-5}
      MAIL_RETRY_BACKOFF_SECONDS: ${MAIL_RETRY_BACKOFF_SECONDS:-60}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-placeholder}
      ACTION_SIGNING_SECRET: ${ACTION_SIGNING_SECRET:-change-me-please-32-bytes-or-more0123456789}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-b3Jpb24tbG9jYWwtZGV2LWFlcy0zMmJ5dGUta2V5ISE=}
      KEY_ENCRYPTION_KEY_VERSION: ${KEY_ENCRYPTION_KEY_VERSION:-1}
      PUBLIC_ACTION_BASE_URL: ${PUBLIC_ACTION_BASE_URL:-http://localhost:8058/approvals}
      MAIL_SINK_DIR: /app/test_env/mailbox
      # Probe ayarları — mevcut host portu 8057; birden fazla worker
      # replica deploy ederseniz her birine farklı host portu override
      # etmeniz gerekir (--scale çakışma yaratır).
      WORKER_HEALTH_PORT: "8057"
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_MIN_UPTIME_SECONDS: ${WORKER_MIN_UPTIME_SECONDS:-15}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-180}
      WORKER_HEARTBEAT_CHECK: ${WORKER_HEARTBEAT_CHECK:-false}
      WORKER_ID: ${WORKER_ID:-panel-worker-1}
      WORKER_CHILD_CMD: "python main.py worker"
    command: ["python", "/app/deployment/scripts/worker_wrapper.py"]
    working_dir: /app/backend
    volumes:
      - ../test_env/mailbox:/app/test_env/mailbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8057/health/live', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # ---- 8057 host : 8057 container ----
    # NOT: 8057 'yi container içinde de worker_probe kullanıyor; birden
    # fazla worker deploy edilirse her birinin WORKER_HEALTH_PORT
    # override edilmelidir.
    ports:
      - "8057:8057"

  # -- Frontend (Next.js) ----------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      network: host
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8056}
        NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-http://localhost:8058}
    container_name: genai-orion-panel-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "8058:3000"
    healthcheck:
      # Alpine-node busybox-wget içerir; next start root/ döner 200 ancak
      # SPA history fallback'leri /about gibi path'lerde 200 döndüğü için
      # kök path yeterli test.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  panel_pg_data:

networks:
  default:
    name: genai-orion-panel-net
