# =============================================================================
# GenAiOrionPanel — tek deployment.
#
#   docker compose up --build
#     → postgres + backend-api + backend-worker + frontend
#
# LDAP: Allianz Active Directory. Compose içinde OpenLDAP / ldap-ui yok.
# Sırlar yalnız ``deployment/.env`` → ``env_file``. Compose ``environment:``
# bloğuna JWT/DB/LDAP parolası yazılmaz — ``$`` interpolasyonu değeri bozar
# ve env_file'ı ezer. Postgres POSTGRES_* değerleri entrypoint'te DB_* 'dan
# kopyalanır; sen yalnız DB_USERNAME / DB_PASSWORD / DB_NAME doldur.
#
# Bu stack mevcut host servislerine DOKUNMAZ: ayrı compose project
# (genai-orion-panel), ayrı network, ayrı container_name, Postgres host'a
# publish edilmez. LiteLLM / MCP / Redis / diğer Postgres'ler zaten
# makinede; onları yeniden ayağa kaldırmayız, URL ile konuşuruz.
#
# Port haritası (host ↔ container) — PANEL_*_HOST_PORT ile override:
#   frontend (next start)        8058 ↔ 3000
#   backend-api (uvicorn)        8056 ↔ 8000   (host 8000 = litellm, KULLANMA)
#   backend-worker (probe)       8057 ↔ 8057
#   postgres                     publish YOK   (host 5432 = idp_genai_postgres)
#
# prdgenai01 (2026-08-25) dolu host portları — bind etme:
#   5432 idp postgres · 5433 raghub-db · 6379/6380/6381 redis
#   8000 litellm · 8001-8055 yoğun (midcorp 8049/8050, mcp 8051-8055)
#   8065 kubeflow · 8067 etl · 8077 masker · 8081 mongo-express · 8090 damage
# Boş blok: 8056-8064. Biz 8056/8057/8058 aldık.
# =============================================================================

name: genai-orion-panel

services:

  # ---------------------------------------------------------------------------
  # CORE
  # ---------------------------------------------------------------------------

  # -- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: genai-orion-panel-postgres
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    # Resmi image POSTGRES_* bekler. Compose ${DB_PASSWORD} interpolasyonu
    # paroladaki ``$`` karakterini yer. env_file literali kopyala.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$DB_USERNAME" ] || [ -z "$$DB_PASSWORD" ] || [ -z "$$DB_NAME" ]; then
          echo "deployment/.env icinde DB_USERNAME, DB_PASSWORD, DB_NAME zorunlu" >&2
          exit 1
        fi
        export POSTGRES_USER="$$DB_USERNAME"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME"
        exec docker-entrypoint.sh postgres
    volumes:
      - panel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USERNAME\" -d \"$$DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Host 5432 zaten idp_genai_postgres'te. Publish YOK — backend
    # compose DNS ``postgres:5432`` kullanır. Operatör:
    #   docker compose exec postgres psql -U "$DB_USERNAME" -d "$DB_NAME"

  # -- Backend API -----------------------------------------------------------
  backend-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      network: host
    container_name: genai-orion-panel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: true
    environment:
      # Yalnız compose topolojisi. Sırlar env_file'dan gelir; buraya basma.
      PROCESS_ROLE: api
      DB_MODE: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      PORT: "8000"
      API_HOST: 0.0.0.0
    extra_hosts:
      # Host'taki litellm (:8000), mcp-gateway (:8030) vb. için.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/etc/ssl/corp:ro
    command: ["sh", "-c", "python main.py migrate && python main.py api"]
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Host 8000 litellm'de; container içi 8000, host'ta PANEL_API_HOST_PORT.
    ports:
      - "${PANEL_API_HOST_PORT:-8056}:8000"

  # -- Backend outbox worker -------------------------------------------------
  backend-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      network: host
    container_name: genai-orion-panel-worker
    restart: unless-stopped
    # NOT: backend-api'ye değil postgres'e bağımlı — worker outbox DB'si
    # paylaşımlı; API ayakta olmasa da fetch yapar. API-only deploy
    # senaryosunda worker'ı `--scale=0` ile durdurabilirsiniz.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: true
    environment:
      PROCESS_ROLE: worker
      DB_MODE: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      MAIL_SINK_DIR: /app/test_env/mailbox
      WORKER_HEALTH_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "/app/deployment/scripts/worker_wrapper.py"]
    working_dir: /app/backend
    volumes:
      - ../test_env/mailbox:/app/test_env/mailbox
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; p=os.environ.get('WORKER_HEALTH_PORT','8057'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/health/live' % p, timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Host 8057 şu an boş. Container dinleme portu WORKER_HEALTH_PORT.
    ports:
      - "${PANEL_WORKER_HOST_PORT:-8057}:${WORKER_HEALTH_PORT:-8057}"

  # -- Frontend (Next.js) ----------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      network: host
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8056}
        NEXT_PUBLIC_WEB_BASE_URL: ${NEXT_PUBLIC_WEB_BASE_URL:-http://localhost:8058}
    container_name: genai-orion-panel-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "${PANEL_WEB_HOST_PORT:-8058}:3000"
    healthcheck:
      # Alpine-node busybox-wget içerir; next start root/ döner 200 ancak
      # SPA history fallback'leri /about gibi path'lerde 200 döndüğü için
      # kök path yeterli test.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  panel_pg_data:

networks:
  default:
    name: genai-orion-panel-net
 
    ipam:
      driver: default
      config:
        - subnet: 10.50.60.0/24
          gateway: 10.50.60.1
